<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Official Bursar Tax Receipt &amp; Invoices | The University of Chicago</title>
  <link rel="icon" type="image/x-icon" href="../assets/crest.png" />
  <link rel="preload" href="../webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/fontawesome.min.css">
  <link rel="stylesheet" href="../css/replica_1to1_enhancements.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #eef1f5;
      font-family: 'UChicagoSansSerif-Regular', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .receipt-top-toolbar {
      width: 100%;
      background: #800000;
      color: #ffffff;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      box-sizing: border-box;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .receipt-toolbar-title {
      font-family: 'UChicagoSerif', Georgia, serif;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .receipt-tab-group {
      display: inline-flex;
      background: rgba(0, 0, 0, 0.35);
      padding: 3px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      gap: 4px;
    }
    .receipt-tab-btn {
      background: transparent;
      color: #f0f0f0;
      border: none;
      padding: 6px 14px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .receipt-tab-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }
    .receipt-tab-btn.is-active {
      background: #ffffff;
      color: #800000;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .receipt-toolbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .receipt-btn {
      padding: 7px 15px;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: 3px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.15s ease;
      border: none;
    }
    .receipt-btn-white {
      background: #ffffff;
      color: #800000;
      font-weight: 700;
    }
    .receipt-btn-white:hover {
      background: #f5f5f5;
    }
    .receipt-btn-dark {
      background: rgba(0, 0, 0, 0.35);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .receipt-btn-dark:hover {
      background: rgba(0, 0, 0, 0.5);
    }
    .receipt-paper-wrap {
      margin: 24px auto;
      max-width: 820px;
      width: calc(100% - 32px);
      background: #ffffff;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #d5d5d5;
      box-sizing: border-box;
      transition: opacity 0.2s ease;
    }
    .receipt-paper-img {
      width: 100%;
      height: auto;
      display: block;
    }
    .receipt-footer-bar {
      width: 100%;
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #666;
    }
    @media print {
      .receipt-top-toolbar, .receipt-footer-bar {
        display: none !important;
      }
      body {
        background: #ffffff !important;
      }
      .receipt-paper-wrap {
        margin: 0 !important;
        width: 100% !important;
        max-width: none !important;
        box-shadow: none !important;
        border: none !important;
      }
    }
  </style>
</head>
<body>

  <header class="receipt-top-toolbar">
    <div class="receipt-toolbar-title">
      <i class="fa-solid fa-building-columns"></i>
      <span>The University of Chicago • Bursar Tax Invoices</span>
    </div>

    <!-- Interactive Invoice Switcher (Seat Locking Deposit temporarily removed) -->
    <div class="receipt-tab-group" role="tablist">
      <!-- TEMPORARILY DISABLED: Seat Locking Deposit ($6,200)
      <button type="button" class="receipt-tab-btn" id="tabSeatDeposit" onclick="switchInvoice('seat_deposit')">
        <i class="fa-solid fa-certificate"></i> Seat Locking Deposit ($6,200 - Due to be Paid)
      </button>
      -->
      <button type="button" class="receipt-tab-btn is-active" id="tabAppFee" onclick="switchInvoice('app_fee')">
        <i class="fa-solid fa-file-invoice-dollar"></i> Application Fee ($90 - Paid 01 Oct 2026)
      </button>
    </div>

    <div class="receipt-toolbar-actions">
      <a href="portal.html" class="receipt-btn receipt-btn-dark">
        <i class="fa-solid fa-arrow-left"></i> Back to Portal
      </a>
      <button type="button" class="receipt-btn receipt-btn-dark" onclick="window.print()">
        <i class="fa-solid fa-print"></i> Print Receipt
      </button>
      <a id="btnDownloadPdf" href="../assets/documents/Official_Application_Fee_Receipt_UCHI_2026.pdf" download="Official_Application_Fee_Receipt_UCHI_2026.pdf" class="receipt-btn receipt-btn-white">
        <i class="fa-solid fa-file-pdf"></i> Download Official PDF
      </a>
    </div>
  </header>

  <main class="receipt-paper-wrap" id="receiptPaperWrap">
    <img id="receiptImage" src="../assets/documents/app_fee_receipt_page_1.png" alt="Official Graduate Admissions Application Fee Receipt (01 Oct 2026 6:30 AM IST) - Devendra Dubey" class="receipt-paper-img" />
  </main>

  <footer class="receipt-footer-bar">
    Official Institutional Document • Office of the Bursar &amp; Student Financial Services • The University of Chicago • 5801 S. Ellis Ave, Chicago, IL 60637
  </footer>

  <script>
    var currentType = 'app_fee';

    function switchInvoice(type) {
      /* TEMPORARILY DISABLED: Seat Locking Deposit ($6,200)
      if (type === 'seat_deposit') {
        var tabSeat = document.getElementById('tabSeatDeposit');
        var tabApp = document.getElementById('tabAppFee');
        if (tabSeat) tabSeat.classList.add('is-active');
        if (tabApp) tabApp.classList.remove('is-active');
        var img = document.getElementById('receiptImage');
        var pdfBtn = document.getElementById('btnDownloadPdf');
        img.src = '../assets/documents/receipt_page_1.png';
        img.alt = 'Official Student Accounts Tax Invoice and Enrollment Mandate ($6,200.00 USD - Due to be Paid) - Devendra Dubey';
        pdfBtn.href = '../assets/documents/Official_Receipt_UCHI_2027_6200.pdf';
        pdfBtn.download = 'Official_Receipt_UCHI_2027_6200.pdf';
        document.title = 'Official Bursar Tax Invoice & Enrollment Mandate ($6,200.00 USD - Due to be Paid) | The University of Chicago';
        return;
      }
      */

      currentType = 'app_fee';
      var tabApp = document.getElementById('tabAppFee');
      var img = document.getElementById('receiptImage');
      var pdfBtn = document.getElementById('btnDownloadPdf');

      if (tabApp) tabApp.classList.add('is-active');
      img.src = '../assets/documents/app_fee_receipt_page_1.png';
      img.alt = 'Official Graduate Admissions Application Fee Receipt (01 Oct 2026 6:30 AM IST) - Devendra Dubey';
      pdfBtn.href = '../assets/documents/Official_Application_Fee_Receipt_UCHI_2026.pdf';
      pdfBtn.download = 'Official_Application_Fee_Receipt_UCHI_2026.pdf';
      document.title = 'Official Application Fee Receipt ($90.00 USD - Paid) | The University of Chicago';
    }

    // Default to application fee receipt
    (function() {
      switchInvoice('app_fee');
    })();
  </script>

</body>
</html>
